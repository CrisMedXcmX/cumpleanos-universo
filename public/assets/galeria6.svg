<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="grad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#260f38" />
      <stop offset="100%" stop-color="#070212" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad)" />
  
  <!-- Estrellas de fondo -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="120" cy="80" r="1.5" />
    <circle cx="250" cy="140" r="1" />
    <circle cx="700" cy="90" r="2" />
    <circle cx="640" cy="220" r="1.2" />
    <circle cx="180" cy="450" r="1.8" />
    <circle cx="720" cy="480" r="1" />
    <circle cx="80" cy="300" r="2" />
    <circle cx="400" cy="70" r="1.5" />
    <circle cx="530" cy="520" r="1.2" />
  </g>
  
  <!-- Marco elegante -->
  <rect x="30" y="30" width="740" height="540" rx="16" fill="none" stroke="#f3a6b2" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6 6" />
  <rect x="45" y="45" width="710" height="510" rx="12" fill="none" stroke="#f3a6b2" stroke-width="0.8" stroke-opacity="0.15" />
  
  <!-- Círculo central con brillo -->
  <circle cx="400" cy="240" r="75" fill="#f3a6b2" fill-opacity="0.1" stroke="#f3a6b2" stroke-width="1.5" filter="url(#glow)" />
  <text x="400" y="260" font-size="64" text-anchor="middle" dominant-baseline="middle">🕊️</text>
  
  <!-- Textos -->
  <text x="400" y="365" font-family="'Cinzel', 'Playfair Display', serif, sans-serif" font-size="28" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="2">6. Complicidad Pura</text>
  <text x="400" y="410" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" fill="#f3a6b2" text-anchor="middle" font-weight="500" letter-spacing="1">✦ RECUERDO FOTOGRÁFICO ✦</text>
  <text x="400" y="460" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#ffffff" opacity="0.6" text-anchor="middle">Reemplaza en /public/assets/galeria6.jpg</text>
</svg>